<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жасыл Ұрпақ — платформа экоамбассадоров</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef3ef;--surface:#fff;--ink:#12261c;--muted:#5d7166;--line:#d5e0d8;--leaf:#1f7a4d;--leaf-d:#155a38;--leaf-l:#dcefe3;--amber:#a86410;--amber-l:#fbecd2;--red:#b23a2e;--blue:#245e9c;--blue-l:#dfeaf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--surface:#172520;--ink:#e6f0ea;--muted:#93a89b;--line:#28392f;--leaf:#4cc383;--leaf-d:#7fd9a8;--leaf-l:#1d3a2b;--amber:#e3a24a;--amber-l:#3a2d14;--red:#f08072;--blue:#7fb3ec;--blue-l:#1b2f46}}
:root[data-theme="dark"]{--bg:#0f1a14;--surface:#172520;--ink:#e6f0ea;--muted:#93a89b;--line:#28392f;--leaf:#4cc383;--leaf-d:#7fd9a8;--leaf-l:#1d3a2b;--amber:#e3a24a;--amber-l:#3a2d14;--red:#f08072;--blue:#7fb3ec;--blue-l:#1b2f46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;align-items:center;gap:16px;min-height:56px;flex-wrap:wrap;padding:6px 0}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--leaf-d);margin-right:auto}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500}
nav button.on{background:var(--leaf-l);color:var(--leaf-d)}
.who{font-size:13px;color:var(--muted);text-align:right}
.who b{color:var(--ink);display:block}
main{padding:24px 0 64px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:18px;margin:28px 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{font-size:32px;line-height:1;display:block;color:var(--leaf-d)}
.stat span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.row{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row.click{cursor:pointer}.row.click:hover{background:var(--bg)}
.grow{flex:1;min-width:200px}
.title{font-weight:600}
.meta{color:var(--muted);font-size:13px}
.bar-p{height:8px;background:var(--leaf-l);border-radius:4px;overflow:hidden;min-width:120px}
.bar-p i{display:block;height:100%;background:var(--leaf);border-radius:4px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted);white-space:nowrap}
.t-progress{background:var(--blue-l);color:var(--blue)}
.t-review{background:var(--amber-l);color:var(--amber)}
.t-revision{background:#f7dcd8;color:var(--red)}
.t-done{background:var(--leaf-l);color:var(--leaf-d)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--leaf)}
.btn.pri{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.pri:hover{background:var(--leaf-d)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.bad{color:var(--red)}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.callout{background:var(--amber-l);color:var(--amber);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:600;cursor:pointer}
.report{margin:8px 0 0;padding:10px 12px;background:var(--bg);border-left:3px solid var(--line);border-radius:6px;font-size:14px;flex-basis:100%}
.report.rv{border-color:var(--red)}.report.ok{border-color:var(--leaf)}.report.pn{border-color:var(--amber)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.auth{max-width:420px;margin:48px auto}
.auth .panel{padding:22px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:100px;resize:vertical}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.demo{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(480px,calc(100% - 24px));padding:20px}
dialog::backdrop{background:rgba(10,20,14,.5)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:24px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>
<script>
"use strict";
const KEY="zhasyl-urpak-v1";
const ST={new:"Свободно",progress:"В работе",review:"На проверке",revision:"На доработке",done:"Выполнено"};
const TCLS={new:"",progress:"t-progress",review:"t-review",revision:"t-revision",done:"t-done"};
const IST={planned:"Планируется",active:"Идёт",done:"Завершена"};
const ROLE={ambassador:"Экоамбассадор",coordinator:"Координатор"};
const d=(n)=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const seed=()=>({
 users:[
  {id:"u1",name:"Айгерим Нурлан",email:"coord@ggh.kz",pass:"123",role:"coordinator",city:"Астана",bio:"Координатор экопрограмм Global Green Hub"},
  {id:"u2",name:"Данияр Сейт",email:"dan@mail.kz",pass:"123",role:"ambassador",city:"Астана",bio:"Студент, волонтёр"},
  {id:"u3",name:"Мадина Ержан",email:"madina@mail.kz",pass:"123",role:"ambassador",city:"Караганда",bio:"Учитель биологии"}],
 initiatives:[
  {id:"i1",title:"Сбор вторсырья в районе",goal:"Организовать постоянные пункты приёма пластика и бумаги",desc:"Работаем с дворами и школами: пункты сбора, листовки, вывоз партнёру-переработчику.",start:d(-20),end:d(40),coord:"u1",status:"active"},
  {id:"i2",title:"Школьные эко-уроки",goal:"Провести 10 уроков об раздельном сборе отходов",desc:"Готовим материалы и проводим уроки в школах города.",start:d(-5),end:d(60),coord:"u1",status:"active"},
  {id:"i3",title:"Посадка деревьев в парке",goal:"Высадить 200 саженцев",desc:"Осенняя акция совместно с акиматом.",start:d(-60),end:d(-10),coord:"u1",status:"done"}],
 tasks:[
  {id:"t1",init:"i1",title:"Организовать пункт сбора во дворе",result:"Оборудованный пункт, договорённость с ОСИ, фотоотчёт",due:d(10),who:"u2",status:"review"},
  {id:"t2",init:"i1",title:"Раздать листовки жителям",result:"Не менее 300 листовок",due:d(14),who:null,status:"new"},
  {id:"t3",init:"i2",title:"Провести урок в школе №12",result:"Урок для 5-го класса, список участников",due:d(20),who:"u3",status:"progress"},
  {id:"t4",init:"i3",title:"Организовать высадку саженцев",result:"200 саженцев в парке",due:d(-12),who:"u2",status:"done"},
  {id:"t5",init:"i3",title:"Собрать волонтёров",result:"Не менее 30 человек",due:d(-20),who:"u3",status:"done"}],
 reports:[
  {id:"r1",task:"t1",text:"Пункт установлен во дворе на Абая 5, договорились с председателем ОСИ. Первые 40 кг пластика собрано.",file:"punkt.jpg",status:"pending",comment:"",date:d(-1)},
  {id:"r2",task:"t4",text:"Высажено 210 саженцев, участвовали 35 человек.",file:"park.pdf",status:"accepted",comment:"Отлично!",date:d(-11)}]
});
let db,S={user:null,view:"dash",init:null,filter:"all",auth:"login",err:"",lang:"ru"};
try{S.lang=localStorage.getItem(KEY+"-l")==="kk"?"kk":"ru"}catch(e){}
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.users)db=seed();
try{const s=localStorage.getItem(KEY+"-s");if(s&&db.users.find(u=>u.id===s))S.user=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const me=()=>db.users.find(u=>u.id===S.user);
const isC=()=>me()&&me().role==="coordinator";
const uname=id=>(db.users.find(u=>u.id===id)||{}).name||"—";
const fd=s=>s?new Date(s).toLocaleDateString(S.lang==="kk"?"kk-KZ":"ru-RU"):"—";
const itasks=id=>db.tasks.filter(t=>t.init===id);
const prog=id=>{const t=itasks(id);return t.length?Math.round(t.filter(x=>x.status==="done").length/t.length*100):0};
const lastRep=id=>db.reports.filter(r=>r.task===id).sort((a,b)=>a.date<b.date?1:-1);

function dialog(html,onOk){
 const f=$("#dform");f.innerHTML=html;if(S.lang==="kk")tr(f);
 f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(onOk(v)===false)return;$("#dlg").close();render()};
 f.querySelector("[data-cancel]").onclick=()=>$("#dlg").close();
 $("#dlg").showModal();
}
const acts=ok=>`<div class="acts"><button type="button" class="btn" data-cancel>Отмена</button><button class="btn pri">${ok}</button></div>`;

/* ---------- actions ---------- */
const A={
 login(){const f=$("#af");const u=db.users.find(x=>x.email===f.email.value.trim().toLowerCase()&&x.pass===f.pass.value);
  if(!u){S.err="Неверная почта или пароль";return render()}enter(u.id)},
 register(){const f=$("#af"),email=f.email.value.trim().toLowerCase();
  if(!f.name.value.trim()||!email||f.pass.value.length<3){S.err="Заполните имя, почту и пароль (от 3 символов)";return render()}
  if(db.users.some(u=>u.email===email)){S.err="Эта почта уже зарегистрирована";return render()}
  const u={id:uid(),name:f.name.value.trim(),email,pass:f.pass.value,role:f.role.value,city:"",bio:""};db.users.push(u);save();enter(u.id)},
 demo(el){const u=db.users.find(x=>x.id===el.dataset.id);enter(u.id)},
 out(){S.user=null;try{localStorage.removeItem(KEY+"-s")}catch(e){}render()},
 nav(el){S.view=el.dataset.v;S.init=null;S.filter="all";render()},
 open(el){S.view="init";S.init=el.dataset.id;render()},
 filter(el){S.filter=el.dataset.f;render()},
 reset(){if(confirm(S.lang==="kk"?"Прототиптің барлық деректерін демо-деректерге қайтару керек пе?":"Сбросить все данные прототипа до демонстрационных?")){db=seed();save();A.out()}},
 newInit(){initForm()},
 editInit(el){initForm(db.initiatives.find(i=>i.id===el.dataset.id))},
 newTask(el){taskForm(el.dataset.id)},
 assign(el){const t=db.tasks.find(x=>x.id===el.dataset.id);
  dialog(`<h3>Назначить исполнителя</h3><label>Экоамбассадор</label><select name="who"><option value="">— не назначен —</option>${db.users.filter(u=>u.role==="ambassador").map(u=>`<option value="${u.id}" ${t.who===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select>${acts("Сохранить")}`,
  v=>{t.who=v.who||null;if(!t.who&&t.status==="progress")t.status="new";if(t.who&&t.status==="new")t.status="progress";save()})},
 take(el){const t=db.tasks.find(x=>x.id===el.dataset.id);t.who=S.user;t.status="progress";save();render()},
 report(el){const t=db.tasks.find(x=>x.id===el.dataset.id);
  dialog(`<h3>Отчёт: ${esc(t.title)}</h3><p class="meta">Ожидаемый результат: ${esc(t.result)}</p><label>Что сделано</label><textarea name="text" required></textarea><label>Подтверждающий материал (необязательно)</label><input type="file" name="file">${acts("Отправить на проверку")}`,
  v=>{if(!v.text.trim())return false;db.reports.push({id:uid(),task:t.id,text:v.text.trim(),file:v.file&&v.file.name||"",status:"pending",comment:"",date:d(0)});t.status="review";save()})},
 accept(el){review(el.dataset.id,true)},
 back(el){review(el.dataset.id,false)},
 profile(){profileForm()}
};
function enter(id){S.user=id;S.err="";S.view="dash";try{localStorage.setItem(KEY+"-s",id)}catch(e){}render()}
function review(tid,ok){const t=db.tasks.find(x=>x.id===tid),r=lastRep(tid).find(x=>x.status==="pending");if(!r)return;
 dialog(`<h3>${ok?"Принять отчёт":"Вернуть на доработку"}</h3><p class="meta">${esc(t.title)} — ${esc(uname(t.who))}</p><p>${esc(r.text)}</p><label>Комментарий${ok?"":" (обязательно)"}</label><textarea name="c" ${ok?"":"required"}></textarea>${acts(ok?"Принять":"Вернуть")}`,
 v=>{if(!ok&&!v.c.trim())return false;r.status=ok?"accepted":"returned";r.comment=v.c.trim();t.status=ok?"done":"revision";save()})}
function initForm(i){const e=i||{title:"",goal:"",desc:"",start:d(0),end:d(30),coord:S.user,status:"planned"};
 dialog(`<h3>${i?"Изменить инициативу":"Новая инициатива"}</h3><label>Название</label><input name="title" required value="${esc(e.title)}"><label>Цель</label><input name="goal" required value="${esc(e.goal)}"><label>Описание</label><textarea name="desc">${esc(e.desc)}</textarea><label>Начало</label><input type="date" name="start" value="${e.start}"><label>Окончание</label><input type="date" name="end" value="${e.end}"><label>Ответственный координатор</label><select name="coord">${db.users.filter(u=>u.role==="coordinator").map(u=>`<option value="${u.id}" ${e.coord===u.id?"selected":""}>${esc(u.name)}</option>`).join("")}</select><label>Статус</label><select name="status">${Object.entries(IST).map(([k,v])=>`<option value="${k}" ${e.status===k?"selected":""}>${v}</option>`).join("")}</select>${acts("Сохранить")}`,
 v=>{if(i)Object.assign(i,v);else db.initiatives.push({id:uid(),...v});save()})}
function taskForm(iid){
 dialog(`<h3>Новое задание</h3><label>Название задания</label><input name="title" required><label>Ожидаемый результат</label><textarea name="result" required></textarea><label>Срок выполнения</label><input type="date" name="due" value="${d(14)}"><label>Исполнитель</label><select name="who"><option value="">— оставить свободным —</option>${db.users.filter(u=>u.role==="ambassador").map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join("")}</select>${acts("Создать")}`,
 v=>{db.tasks.push({id:uid(),init:iid,title:v.title,result:v.result,due:v.due,who:v.who||null,status:v.who?"progress":"new"});save()})}
function profileForm(){const u=me();
 dialog(`<h3>Профиль</h3><label>Имя</label><input name="name" required value="${esc(u.name)}"><label>Город</label><input name="city" value="${esc(u.city)}"><label>О себе</label><textarea name="bio">${esc(u.bio)}</textarea>${acts("Сохранить")}`,
 v=>{Object.assign(u,v);save()})}

/* ---------- views ---------- */
const tag=(k)=>`<span class="tag ${TCLS[k]||""}">${ST[k]}</span>`;
function authView(){const reg=S.auth==="register";
 return `<div class="wrap auth"><div style="text-align:right"><button class="btn sm" data-a="lang">${S.lang==="kk"?"Русский":"Қазақша"}</button></div><h1 style="text-align:center;color:var(--leaf-d)">Жасыл Ұрпақ</h1><p class="sub" style="text-align:center">Платформа экоамбассадоров Global Green Hub</p>
 <div class="panel"><div class="chips"><button data-a="authTab" data-t="login" class="${reg?"":"on"}">Вход</button><button data-a="authTab" data-t="register" class="${reg?"on":""}">Регистрация</button></div>
 <form id="af" onsubmit="event.preventDefault();A.${reg?"register":"login"}()">
 ${reg?`<label>Имя и фамилия</label><input name="name" autocomplete="name">`:""}
 <label>Электронная почта</label><input name="email" type="email" autocomplete="email"><label>Пароль</label><input name="pass" type="password" autocomplete="${reg?"new-password":"current-password"}">
 ${reg?`<label>Роль</label><select name="role"><option value="ambassador">Экоамбассадор</option><option value="coordinator">Координатор</option></select>`:""}
 <div class="err">${esc(S.err)}</div><button class="btn pri" style="width:100%;margin-top:6px">${reg?"Создать аккаунт":"Войти"}</button></form>
 <div class="demo"><span class="meta" style="width:100%">Демо-вход:</span><button class="btn sm" data-a="demo" data-id="u1">Координатор</button><button class="btn sm" data-a="demo" data-id="u2">Данияр (амбассадор)</button><button class="btn sm" data-a="demo" data-id="u3">Мадина (амбассадор)</button></div></div></div>`}
A.authTab=el=>{S.auth=el.dataset.t;S.err="";render()};

function dashView(){const amb=db.users.filter(u=>u.role==="ambassador").length,tk=db.tasks.length,td=db.tasks.filter(t=>t.status==="done").length,idn=db.initiatives.filter(i=>i.status==="done").length,pend=db.tasks.filter(t=>t.status==="review").length;
 return `<h1>Сводка</h1><p class="sub">Общие результаты платформы</p>
 ${isC()&&pend?`<div class="callout" data-a="nav" data-v="tasks" data-f="review">Отчётов ждут проверки: ${pend}</div>`:""}
 <div class="stats"><div class="stat"><b>${amb}</b><span>экоамбассадоров</span></div><div class="stat"><b>${db.initiatives.length}</b><span>инициатив (завершено: ${idn})</span></div><div class="stat"><b>${tk}</b><span>заданий всего</span></div><div class="stat"><b>${td}</b><span>заданий выполнено</span></div></div>
 <h2>Ход инициатив</h2><div class="panel">${db.initiatives.map(i=>{const n=itasks(i.id).length,dn=itasks(i.id).filter(t=>t.status==="done").length,ppl=new Set(itasks(i.id).map(t=>t.who).filter(Boolean)).size;
 return `<div class="row click" data-a="open" data-id="${i.id}"><div class="grow"><div class="title">${esc(i.title)}</div><div class="meta">Заданий: ${dn} из ${n} · участников: ${ppl} · ${IST[i.status]}</div></div><div class="bar-p" style="width:160px"><i style="width:${prog(i.id)}%"></i></div><b>${prog(i.id)}%</b></div>`}).join("")||'<div class="empty">Инициатив пока нет</div>'}</div>`}

function initsView(){return `<div class="head"><div><h1>Инициативы</h1><p class="sub">Каталог экологических инициатив</p></div>${isC()?'<button class="btn pri" data-a="newInit">Новая инициатива</button>':""}</div>
 <div class="panel">${db.initiatives.map(i=>`<div class="row click" data-a="open" data-id="${i.id}"><div class="grow"><div class="title">${esc(i.title)}</div><div class="meta">${esc(i.goal)}</div><div class="meta">${fd(i.start)} — ${fd(i.end)} · ${esc(uname(i.coord))}</div></div><span class="tag ${i.status==="done"?"t-done":i.status==="active"?"t-progress":""}">${IST[i.status]}</span><div class="bar-p"><i style="width:${prog(i.id)}%"></i></div></div>`).join("")||'<div class="empty">Инициатив пока нет</div>'}</div>`}

function taskRow(t,showInit){const w=t.who,reps=lastRep(t.id),mine=w===S.user;
 let b="";
 if(isC()){if(t.status==="review")b+=`<button class="btn sm pri" data-a="accept" data-id="${t.id}">Принять</button><button class="btn sm bad" data-a="back" data-id="${t.id}">Вернуть</button>`;
  if(t.status!=="done")b+=`<button class="btn sm" data-a="assign" data-id="${t.id}">${w?"Сменить":"Назначить"}</button>`}
 else{if(t.status==="new")b+=`<button class="btn sm pri" data-a="take" data-id="${t.id}">Взять задание</button>`;
  if(mine&&(t.status==="progress"||t.status==="revision"))b+=`<button class="btn sm pri" data-a="report" data-id="${t.id}">Сдать отчёт</button>`}
 const rp=reps.map(r=>`<div class="report ${r.status==="accepted"?"ok":r.status==="returned"?"rv":"pn"}"><b>${fd(r.date)} · ${r.status==="accepted"?"принят":r.status==="returned"?"возвращён":"ожидает проверки"}</b><br>${esc(r.text)}${r.file?`<br><span class="meta">Файл: ${esc(r.file)}</span>`:""}${r.comment?`<br><i>Комментарий координатора: ${esc(r.comment)}</i>`:""}</div>`).join("");
 const ini=db.initiatives.find(i=>i.id===t.init);
 return `<div class="row"><div class="grow"><div class="title">${esc(t.title)}</div><div class="meta">${showInit&&ini?esc(ini.title)+" · ":""}Результат: ${esc(t.result)}</div><div class="meta">Срок: ${fd(t.due)} · Исполнитель: ${w?esc(uname(w)):"не назначен"}</div></div>${tag(t.status)}${b}${rp}</div>`}

function initView(){const i=db.initiatives.find(x=>x.id===S.init);if(!i){S.view="inits";return initsView()}
 const ts=itasks(i.id),n=ts.length,dn=ts.filter(t=>t.status==="done").length,ppl=new Set(ts.map(t=>t.who).filter(Boolean)).size;
 return `<div class="head"><div><h1>${esc(i.title)}</h1><p class="sub">${esc(i.goal)}</p></div><div><button class="btn" data-a="nav" data-v="inits">← К каталогу</button> ${isC()?`<button class="btn" data-a="editInit" data-id="${i.id}">Изменить</button>`:""}</div></div>
 <div class="panel"><div class="kv"><div><span>Статус</span>${IST[i.status]}</div><div><span>Сроки</span>${fd(i.start)} — ${fd(i.end)}</div><div><span>Координатор</span>${esc(uname(i.coord))}</div><div><span>Участников</span>${ppl}</div><div><span>Выполнено заданий</span>${dn} из ${n}</div><div><span>Прогресс</span><div class="bar-p" style="margin-top:8px"><i style="width:${prog(i.id)}%"></i></div></div></div>${i.desc?`<div style="padding:0 16px 16px">${esc(i.desc)}</div>`:""}</div>
 <div class="head"><h2>Задания</h2>${isC()?`<button class="btn pri" data-a="newTask" data-id="${i.id}">Добавить задание</button>`:""}</div>
 <div class="panel">${ts.map(t=>taskRow(t)).join("")||'<div class="empty">Заданий пока нет</div>'}</div>`}

function tasksView(){const c=isC(),f=S.filter;
 const chips=c?[["all","Все"],["review","На проверке"],["new","Свободные"]]:[["all","Мои"],["new","Свободные"],["done","Выполненные"]];
 let ts=db.tasks.filter(t=>c?(f==="all"||t.status===f):(f==="new"?t.status==="new":f==="done"?t.who===S.user&&t.status==="done":t.who===S.user));
 return `<h1>${c?"Задания":"Мои задания"}</h1><p class="sub">${c?"Проверяйте отчёты и назначайте исполнителей":"Выбирайте свободные задания и сдавайте отчёты"}</p>
 <div class="chips">${chips.map(([k,l])=>`<button data-a="filter" data-f="${k}" class="${f===k?"on":""}">${l}</button>`).join("")}</div>
 <div class="panel">${ts.map(t=>taskRow(t,true)).join("")||'<div class="empty">Здесь пока пусто</div>'}</div>`}

function profView(){const u=me(),my=db.tasks.filter(t=>t.who===u.id);
 return `<h1>Профиль</h1><p class="sub">${ROLE[u.role]}</p><div class="panel"><div class="kv"><div><span>Имя</span>${esc(u.name)}</div><div><span>Почта</span>${esc(u.email)}</div><div><span>Город</span>${esc(u.city)||"—"}</div><div><span>Роль</span>${ROLE[u.role]}</div>${u.role==="ambassador"?`<div><span>Выполнено заданий</span>${my.filter(t=>t.status==="done").length} из ${my.length}</div>`:""}</div><div style="padding:0 16px 16px">${esc(u.bio)||'<span class="meta">Расскажите о себе</span>'}</div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-a="profile">Редактировать</button><button class="btn" data-a="out">Выйти</button></div>`}

function render(){const app=$("#app");
 if(!me()){app.innerHTML=authView();return}
 const u=me(),tabs=[["dash","Сводка"],["inits","Инициативы"],["tasks",isC()?"Задания":"Мои задания"],["prof","Профиль"]];
 const cur=S.view==="init"?"inits":S.view;
 const body=S.view==="dash"?dashView():S.view==="inits"?initsView():S.view==="init"?initView():S.view==="tasks"?tasksView():profView();
 app.innerHTML=`<header class="top"><div class="wrap bar"><div class="brand">Жасыл Ұрпақ<small>Global Green Hub</small></div><nav>${tabs.map(([k,l])=>`<button data-a="nav" data-v="${k}" class="${cur===k?"on":""}">${l}</button>`).join("")}</nav><button class="btn sm" data-a="lang">${S.lang==="kk"?"Русский":"Қазақша"}</button><div class="who"><b>${esc(u.name)}</b>${ROLE[u.role]}</div></div></header><main class="wrap">${body}<p class="note">Прототип. Данные хранятся в браузере. <a href="#" data-a="reset">Сбросить демо-данные</a></p></main>`}

document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;e.preventDefault();if(el.dataset.f&&el.dataset.a==="nav"){A.nav(el);S.filter=el.dataset.f;return render()}const f=A[el.dataset.a];if(f)f(el)});

function tr(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 for(const n of ns){if(n.parentNode&&n.parentNode.tagName==="TEXTAREA")continue;const o=n.nodeValue,t=o.trim();if(!t)continue;
  if(EX[t]){n.nodeValue=o.replace(t,EX[t]);continue}
  let v=o;for(const[a,b]of SUBP)if(v.includes(a))v=v.split(a).join(b);
  v=v.replace(/(\d+) из (\d+)/g,"$1 / $2");n.nodeValue=v}}
A.lang=()=>{S.lang=S.lang==="kk"?"ru":"kk";try{localStorage.setItem(KEY+"-l",S.lang)}catch(e){}render()};
const render0=render;render=function(){render0();document.documentElement.lang=S.lang;if(S.lang==="kk")tr($("#app"))};

render();
